name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Debug-only signing continuity: keeps test APK updates installable over
      # the previous GitHub Actions build. Production signing stays separate.
      - uses: actions/cache@v4
        id: debug-signing-cache
        with:
          # Use the absolute path Gradle reads. A literal `~` cache path was
          # restored elsewhere, so Gradle silently generated a new key on
          # every runner and made successive APKs impossible to update.
          path: /home/runner/.android/debug.keystore
          key: mahalle-debug-keystore-v2
      - name: Prepare stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Mahalle Ustasi Debug,O=Development,C=TR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
      - run: npm ci
      - run: npm run android:sync
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - name: Verify stable APK signing identity
        run: |
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          apksigner_path="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify "$apk_path"

          signer_block="$(unzip -Z1 "$apk_path" | sed -n '/^META-INF\/.*\.RSA$/p' | head -n 1)"
          test -n "$signer_block"
          unzip -p "$apk_path" "$signer_block" > "$RUNNER_TEMP/apk-signer.p7b"
          openssl pkcs7 -inform DER -in "$RUNNER_TEMP/apk-signer.p7b" \
            -print_certs -out "$RUNNER_TEMP/apk-signer.pem"
          openssl x509 -in "$RUNNER_TEMP/apk-signer.pem" -outform DER \
            -out "$RUNNER_TEMP/apk-signer.der"
          keytool -exportcert \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -file "$RUNNER_TEMP/keystore-signer.der"
          cmp "$RUNNER_TEMP/apk-signer.der" "$RUNNER_TEMP/keystore-signer.der"
          sha256sum "$RUNNER_TEMP/apk-signer.der"
      - uses: actions/upload-artifact@v4
        with:
          name: mahalle-ustasi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
